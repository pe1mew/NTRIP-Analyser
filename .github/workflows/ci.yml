# Continuous integration.
#
# This repository shipped for months with none, and the reason it needs
# one now is that the checks it already has run only when somebody
# remembers to type the command: seven tests, forty-five release checks,
# an edition-parity task. During a fortnight of closed testing a
# regression would sit undetected in exactly the code twelve strangers
# are running.
#
# What each job is *for*:
#
#   core     the measurement core and its tests, on Linux. They link
#            ntrip_core alone and touch no platform headers, so this is
#            cheap -- and it is the code every frontend shares, where a
#            fault reaches all four programs at once.
#   android  both editions, built and checked for edition parity. The
#            Android app is the product now, and its breakages are the
#            kind a compiler catches: a missing import, an experimental
#            API, a Gradle plugin that moved.
#   claims   the verification commands under the project's own memory,
#            weekly rather than per-push, because several of them reach
#            the network and a checker that cries wolf gets ignored.
#
# **What this does NOT cover, deliberately**: the Win32 GUI. It is
# Windows-only, and building it here would need a MinGW toolchain whose
# failures would say more about the runner than about the code. Its only
# build is the CMake target -- build-gui.bat retired with the TLS
# rollout -- and it is verified by hand on the machine that ships it,
# see docs/RUNBOOK.md; that gap is stated rather than hidden.
#
# The UNIX daemon *is* covered, twice: CMake builds it in the core job,
# and `make -C service` exercises the hand-written path that a packager
# or a VPS deployment actually uses. This comment used to list the daemon
# beside the GUI as uncovered, which the core job's own log contradicted
# from the first run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning: the claims job, which is about decay over time
    # rather than about any particular change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  core:
    name: Core and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, because the memory index proves "3.8.0 released" with
          # `git rev-parse v3.8.0` and a default checkout fetches none.
          # That made a *true* claim fail here from 2026-08-25, red on
          # two pushes, while passing on every desk -- the verify
          # command was right and its environment was not.
          fetch-depth: 0

      # CMakeLists.txt sets no warning flags, so every build of this
      # project -- here and on a developer's machine -- runs on the
      # compiler's defaults and says almost nothing.
      #
      # The tree is warning-free under -Wall -Wextra, and getting there
      # took two goes. The first measurement used `gcc -fsyntax-only` and
      # reported one warning; that method *cannot* see the truncation
      # diagnostics, which need the optimiser's value-range propagation
      # and so appear only from -O2. This job found the other six on its
      # first real run. Measure with -O2, or do not claim a number.
      #
      # Deliberately not -Werror. A newer compiler inventing a warning
      # would then stop a release that is otherwise sound; the point is to
      # be told, not to be blocked.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra"

      # The CLI and the daemon come with it on Linux; the GUI is excluded
      # by if(WIN32) in CMakeLists.txt, so nothing here needs a guard.
      - name: Build
        run: cmake --build build --parallel

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      # The daemon has a second build path: service/Makefile, with its own
      # flags (-Wall -Wextra -std=c99, plus the POSIX feature macros that
      # strict c99 would otherwise hide) and its own hand-written list of
      # sources. CMake builds the daemon from its own list, so it cannot
      # notice when that one falls behind: a file added under src/core/
      # builds here and breaks `make -C service` silently -- and that is
      # the path a packager, or anyone deploying to a VPS, actually uses.
      #
      # Same class of gap the GUI's build-gui.bat once was (retired with
      # the TLS rollout); this one costs seconds to close.
      - name: The daemon's own build path
        run: make -C service

      # Reads what the project claims about itself and compares it with
      # the thing claimed: version, in-app links, the check count, Play's
      # limits, the generated notices, targetSdk, 16 KB alignment.
      - name: Release checks
        run: python tools/check_release.py

      # The claims in CLAUDE.md and memory/ that are settled from the tree
      # -- greps and test runs, milliseconds each. The ones that leave the
      # machine are marked verify-net: and belong to the weekly job below.
      #
      # Here rather than only there, because a claim that breaks on a push
      # should fail on that push. CLAUDE.md said "Seven tests" for two days
      # after there were nine: it broke on a Saturday, and the weekly job
      # reported it on Monday morning against a scheduled run rather than
      # against the change that caused it.
      - name: Verified claims (offline)
        run: python tools/verify_memory.py --offline

  android:
    name: Both editions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The runner has an Android SDK but does not put its command-line
      # tools on PATH -- the first run of this workflow died on
      # "sdkmanager: command not found". This action puts them there and
      # accepts the licences.
      - uses: android-actions/setup-android@v3

      # Pinned in app/build.gradle.kts; the runner ships a different one,
      # and a mismatch fails at configuration time with a path error
      # rather than "NDK not found".
      - name: Install the pinned NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      # checkEditionParity runs as a preBuild dependency, so this also
      # enforces that free and pro differ only by their Features object.
      - name: Build free and pro
        working-directory: android
        run: ./gradlew assembleFreeDebug assembleProDebug --no-daemon

  claims:
    name: Verified claims
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags: several claims are proved by them

      # Some verify commands run the tests; they need something to run.
      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # Everything, including the verify-net: claims that ask whether the
      # site and the wiki are still live -- which is why this job is
      # weekly: it is checking the world, not the commit. The rest of them
      # already ran per push, in the core job; running them again here
      # costs seconds and keeps one command that means "all of it".
      - name: Verify the claims in CLAUDE.md and memory/
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/verify_memory.py
